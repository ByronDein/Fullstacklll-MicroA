# Perfil "cloud": conexion a una base Oracle Cloud (Autonomous Database) usando wallet.
# Se activa con:  -Dspring-boot.run.profiles=cloud   (o SPRING_PROFILES_ACTIVE=cloud)
#
# Datos que entrega el profesor (o que salen de la consola de Oracle Cloud):
#   - carpeta del wallet descomprimida  -> variable TNS_ADMIN
#   - nombre del servicio (ej: mibda2_high) -> variable DB_SERVICE
#   - usuario y clave de la base        -> variables DB_USER y DB_PASSWORD

spring.datasource.url=jdbc:oracle:thin:@${DB_SERVICE}?TNS_ADMIN=${TNS_ADMIN}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
