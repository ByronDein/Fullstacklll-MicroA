spring.application.name=usuarios

logging.level.root=INFO

# Conexion a Oracle. Variables DB_URL, DB_USERNAME y DB_PASSWORD (Oracle Cloud con wallet, via TNS_ADMIN).
# Si no estan definidas se usa el Oracle local de docker-compose.yml
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:foro}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:Foro12345}}
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# necesario detras de Nginx (respeta el prefijo /api/... en los enlaces HATEOAS)
server.forward-headers-strategy=framework
server.port=8081
